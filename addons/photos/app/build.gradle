plugins {
    id 'com.android.application'
}

android {
    namespace 'id.teduh.photos'
    compileSdk 34

    defaultConfig {
        applicationId 'id.teduh.photos'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The QR code on the "add from phone" screen. Nayuki's QR Code generator, MIT, no dependencies of its own.
    implementation 'io.nayuki:qrcodegen:1.8.0'
}
